<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Physics-Informed ML</title>
  <desc id="desc">Machine learning guided by equations and mechanics</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: rgba(148,163,184,0.13); stroke-width: 1; }
      .title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 500; }
      .label { fill: #e5e7eb; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #bfdbfe; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .line { stroke: #60a5fa; stroke-width: 5; stroke-linecap: round; }
      .soft { fill: rgba(96,165,250,0.14); stroke: rgba(96,165,250,0.45); stroke-width: 2; }
      .box { fill: rgba(15,23,42,0.70); stroke: rgba(96,165,250,0.50); stroke-width: 2; }
      .accent { fill: url(#blue); filter: url(#glow); }
      .accent2 { fill: url(#purple); filter: url(#glow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="38"/>
  <g opacity="0.65">
    <path class="grid" d="M100 90H1100M100 190H1100M100 290H1100M100 390H1100M100 490H1100M100 590H1100"/>
    <path class="grid" d="M120 70V650M260 70V650M400 70V650M540 70V650M680 70V650M820 70V650M960 70V650M1100 70V650"/>
  </g>
  <circle cx="1050" cy="120" r="130" fill="rgba(96,165,250,0.12)"/>
  <circle cx="120" cy="630" r="160" fill="rgba(168,85,247,0.13)"/>
  <text class="title" x="70" y="90">Physics-Informed ML</text>
  <text class="subtitle" x="72" y="126">Machine learning guided by equations and mechanics</text>
  
  <g transform="translate(105,170)">
    <rect class="box" x="60" y="90" width="260" height="100" rx="24"/>
    <rect class="box" x="370" y="90" width="260" height="100" rx="24"/>
    <rect class="box" x="680" y="90" width="260" height="100" rx="24"/>
    <text class="label" x="148" y="152">Data</text>
    <text class="label" x="435" y="152">Physics</text>
    <text class="label" x="755" y="152">Learning</text>
    <path d="M320 140 H370 M630 140 H680" class="line"/>
    <text class="label" x="445" y="300">Mechanics-Informed AI Model</text>
    <g transform="translate(430,340)">
      <circle class="accent" cx="0" cy="0" r="16"/><circle class="accent" cx="0" cy="70" r="16"/><circle class="accent" cx="0" cy="140" r="16"/>
      <circle class="accent2" cx="140" cy="35" r="16"/><circle class="accent2" cx="140" cy="105" r="16"/>
      <circle class="accent" cx="280" cy="70" r="16"/>
      <path d="M16 0 L124 35 M16 0 L124 105 M16 70 L124 35 M16 70 L124 105 M16 140 L124 35 M16 140 L124 105 M156 35 L264 70 M156 105 L264 70" stroke="rgba(191,219,254,0.55)" stroke-width="3"/>
    </g>
  </g>

</svg>
