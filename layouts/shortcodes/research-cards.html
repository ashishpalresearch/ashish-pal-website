<div class="research-grid">
  {{ range .Page.Params.research_cards }}
    <div class="research-card">
      <h3>{{ .title }}</h3>
      <p>{{ .description }}</p>
    </div>
  {{ end }}
</div>

<style>
.research-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.5rem;
  margin-top: 2rem;
}

.research-card {
  background: white;
  border-radius: 18px;
  padding: 1.5rem;
  border: 1px solid #e5e7eb;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

.research-card h3 {
  margin-top: 0;
  color: #0f172a;
}

.research-card p {
  color: #475569;
  line-height: 1.6;
}
</style>
