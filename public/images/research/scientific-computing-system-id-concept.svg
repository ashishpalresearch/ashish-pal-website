<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Computing</title>
  <desc id="desc">Simulation, inverse problems, and system identification</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: rgba(148,163,184,0.13); stroke-width: 1; }
      .title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 500; }
      .label { fill: #e5e7eb; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #bfdbfe; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .line { stroke: #60a5fa; stroke-width: 5; stroke-linecap: round; }
      .soft { fill: rgba(96,165,250,0.14); stroke: rgba(96,165,250,0.45); stroke-width: 2; }
      .box { fill: rgba(15,23,42,0.70); stroke: rgba(96,165,250,0.50); stroke-width: 2; }
      .accent { fill: url(#blue); filter: url(#glow); }
      .accent2 { fill: url(#purple); filter: url(#glow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="38"/>
  <g opacity="0.65">
    <path class="grid" d="M100 90H1100M100 190H1100M100 290H1100M100 390H1100M100 490H1100M100 590H1100"/>
    <path class="grid" d="M120 70V650M260 70V650M400 70V650M540 70V650M680 70V650M820 70V650M960 70V650M1100 70V650"/>
  </g>
  <circle cx="1050" cy="120" r="130" fill="rgba(96,165,250,0.12)"/>
  <circle cx="120" cy="630" r="160" fill="rgba(168,85,247,0.13)"/>
  <text class="title" x="70" y="90">Scientific Computing</text>
  <text class="subtitle" x="72" y="126">Simulation, inverse problems, and system identification</text>
  
  <g transform="translate(110,165)">
    <g transform="translate(70,70)">
      <rect class="soft" x="0" y="0" width="56" height="56" rx="10"/>
<rect class="soft" x="72" y="0" width="56" height="56" rx="10"/>
<rect class="soft" x="144" y="0" width="56" height="56" rx="10"/>
<rect class="soft" x="216" y="0" width="56" height="56" rx="10"/>
<rect class="soft" x="288" y="0" width="56" height="56" rx="10"/>
<rect class="soft" x="0" y="72" width="56" height="56" rx="10"/>
<rect class="soft" x="72" y="72" width="56" height="56" rx="10"/>
<rect class="soft" x="144" y="72" width="56" height="56" rx="10"/>
<rect class="soft" x="216" y="72" width="56" height="56" rx="10"/>
<rect class="soft" x="288" y="72" width="56" height="56" rx="10"/>
<rect class="soft" x="0" y="144" width="56" height="56" rx="10"/>
<rect class="soft" x="72" y="144" width="56" height="56" rx="10"/>
<rect class="soft" x="144" y="144" width="56" height="56" rx="10"/>
<rect class="soft" x="216" y="144" width="56" height="56" rx="10"/>
<rect class="soft" x="288" y="144" width="56" height="56" rx="10"/>
<rect class="soft" x="0" y="216" width="56" height="56" rx="10"/>
<rect class="soft" x="72" y="216" width="56" height="56" rx="10"/>
<rect class="soft" x="144" y="216" width="56" height="56" rx="10"/>
<rect class="soft" x="216" y="216" width="56" height="56" rx="10"/>
<rect class="soft" x="288" y="216" width="56" height="56" rx="10"/>
    </g>
    <path d="M560 205 C650 145, 745 285, 850 215" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round"/>
    <path d="M560 305 C650 245, 745 385, 850 315" fill="none" stroke="url(#purple)" stroke-width="8" stroke-linecap="round"/>
    <rect class="box" x="600" y="430" width="300" height="85" rx="22"/>
    <text class="label" x="650" y="482">Discovered Model</text>
    <text class="small" x="150" y="410">Simulation Mesh</text>
    <text class="small" x="605" y="145">Input-Output Response</text>
  </g>

</svg>
