<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Digital Twins</title>
  <desc id="desc">Connecting physical infrastructure with computational models</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: rgba(148,163,184,0.13); stroke-width: 1; }
      .title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 500; }
      .label { fill: #e5e7eb; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #bfdbfe; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .line { stroke: #60a5fa; stroke-width: 5; stroke-linecap: round; }
      .soft { fill: rgba(96,165,250,0.14); stroke: rgba(96,165,250,0.45); stroke-width: 2; }
      .box { fill: rgba(15,23,42,0.70); stroke: rgba(96,165,250,0.50); stroke-width: 2; }
      .accent { fill: url(#blue); filter: url(#glow); }
      .accent2 { fill: url(#purple); filter: url(#glow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="38"/>
  <g opacity="0.65">
    <path class="grid" d="M100 90H1100M100 190H1100M100 290H1100M100 390H1100M100 490H1100M100 590H1100"/>
    <path class="grid" d="M120 70V650M260 70V650M400 70V650M540 70V650M680 70V650M820 70V650M960 70V650M1100 70V650"/>
  </g>
  <circle cx="1050" cy="120" r="130" fill="rgba(96,165,250,0.12)"/>
  <circle cx="120" cy="630" r="160" fill="rgba(168,85,247,0.13)"/>
  <text class="title" x="70" y="90">Digital Twins</text>
  <text class="subtitle" x="72" y="126">Connecting physical infrastructure with computational models</text>
  
  <g transform="translate(105,185)">
    <rect class="box" x="40" y="130" width="310" height="210" rx="26"/>
    <rect class="box" x="650" y="130" width="310" height="210" rx="26"/>
    <path d="M96 285 H294 M120 245 H270 M150 205 H240" stroke="url(#blue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M735 195 h140 M735 240 h95 M735 285 h170" stroke="url(#purple)" stroke-width="12" stroke-linecap="round"/>
    <path d="M390 210 C470 150, 540 150, 620 210" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <path d="M620 260 C540 320, 470 320, 390 260" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
    <polygon points="615,210 590,195 592,225" fill="#60a5fa"/>
    <polygon points="395,260 420,245 418,275" fill="#22d3ee"/>
    <text class="label" x="83" y="380">Physical Structure</text>
    <text class="label" x="690" y="380">Computational Twin</text>
    <rect class="soft" x="65" y="455" width="250" height="64" rx="18"/>
    <rect class="soft" x="375" y="455" width="250" height="64" rx="18"/>
    <rect class="soft" x="685" y="455" width="250" height="64" rx="18"/>
    <text class="small" x="142" y="495">Sensing</text>
    <text class="small" x="435" y="495">Model Update</text>
    <text class="small" x="758" y="495">Prediction</text>
  </g>

</svg>
